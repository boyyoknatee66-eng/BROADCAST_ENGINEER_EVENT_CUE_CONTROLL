        function renderRuler(totalWidth) {
            elements.rulerTicks.innerHTML = '';
            elements.rulerTicks.style.width = `${totalWidth}px`;

            let majorStepSec = 300;
            let minorStepSec = 60;

            const span = state.activeSpanSeconds;
            if (span <= 1800) { majorStepSec = 300; minorStepSec = 60; }
            else if (span <= 3600) { majorStepSec = 600; minorStepSec = 60; }
            else if (span <= 10800) { majorStepSec = 1800; minorStepSec = 300; }
            else if (span <= 21600) { majorStepSec = 3600; minorStepSec = 600; }
            else if (span <= 43200) { majorStepSec = 7200; minorStepSec = 900; }
            else if (span <= 86400) { majorStepSec = 14400; minorStepSec = 1800; }
            else { majorStepSec = 21600; minorStepSec = 3600; }

            const totalSeconds = 86400;

            for (let i = 0; i < totalSeconds; i += minorStepSec) {
                const tick = document.createElement('div');
                const x = i * state.pxPerSecond;
                const isMajor = i % majorStepSec === 0;

                tick.className = `absolute top-0 bottom-0 border-l ${isMajor ? 'border-slate-400/80 h-full' : 'border-slate-800 h-1/2 bottom-0 top-auto'}`;
                tick.style.left = `${x}px`;

                if (isMajor) {
                    const label = document.createElement('span');
                    label.className = 'absolute top-1 left-1 font-mono text-[15px] text-slate-300 font-bold tracking-tight bg-slate-950/60 px-1 rounded';
                    label.textContent = secondsToTimecode(i);
                    tick.appendChild(label);
                }

                elements.rulerTicks.appendChild(tick);
            }

            const endEdge = document.createElement('div');
            endEdge.className = 'absolute top-0 bottom-0 border-l border-slate-400/80';
            endEdge.style.left = `${totalWidth}px`;
            elements.rulerTicks.appendChild(endEdge);
        }

        function makeDraggableAndResizable(element, evtData) {
            let startX, initialLeft, initialWidth, isResizing = false;
            let hasDragged = false;

            element.addEventListener('mousedown', (e) => {
                if (state.locked || evtData.allDay) return;
                if (e.target.classList.contains('resize-handle')) {
                    isResizing = true;
                } else {
                    isResizing = false;
                }

                startX = e.clientX;
                initialLeft = parseFloat(element.style.left);
                initialWidth = parseFloat(element.style.width);
                hasDragged = false;

                const onMouseMove = (moveEvent) => {
                    const deltaX = moveEvent.clientX - startX;
                    if (Math.abs(deltaX) > 3) hasDragged = true;
                    if (!hasDragged) return;

                    if (isResizing) {
                        const newWidth = Math.min(Math.max(state.pxPerSecond * 2, initialWidth + deltaX), (86400 - evtData.start) * state.pxPerSecond);
                        element.style.width = `${newWidth}px`;
                        evtData.duration = Math.max(1, Math.round(newWidth / state.pxPerSecond));
                    } else {
                        const newLeft = Math.min(Math.max(0, initialLeft + deltaX), Math.max(0, (86400 - evtData.duration) * state.pxPerSecond));
                        element.style.left = `${newLeft}px`;
                        evtData.start = Math.round(newLeft / state.pxPerSecond);
                    }
                    
                    const timeSubtext = element.querySelector('.font-mono.text-\\[9px\\]');
                    if (timeSubtext) {
                        timeSubtext.textContent = `${secondsToTimecode(evtData.start)} - ${secondsToTimecode(evtData.start + evtData.duration)}`;
                    }
                    const badge = element.querySelector('.font-mono.text-\\[9px\\]');
                    if (badge) badge.textContent = `${evtData.duration}s`;
                };

                const onMouseUp = () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', onMouseUp);
                };

                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', onMouseUp);
            });
        }

        function animationLoop() {
            const now = new Date();
            syncToday(now);
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const millis = now.getMilliseconds();

            state.currentSystemSeconds = (hours * 3600) + (minutes * 60) + seconds + (millis / 1000);

            elements.wallClock.textContent = `${secondsToTimecode(state.currentSystemSeconds)}:${String(seconds).padStart(2, '0')}`;

            updatePositions();
            checkAlertCues();

            requestAnimationFrame(animationLoop);
        }

        function updatePositions() {
            const centerOffsetX = getCenterOffset();
            const scrollX = centerOffsetX - (state.currentSystemSeconds * state.pxPerSecond) + state.userOffsetPx;

            elements.rulerTicks.style.transform = `translateX(${scrollX}px)`;
            elements.layersContainer.style.transform = `translateX(${scrollX}px)`;
            elements.playhead.style.transform = `translateX(calc(-50% + ${state.userOffsetPx}px))`;

            // Keep the layer-name sidebar's vertical scroll in lockstep with the canvas,
            // every animation frame (not just on the 'scroll' event, which lags one frame
            // behind during active wheel scrolling). Synced by ratio rather than raw pixel
            // value so the TOP and BOTTOM always line up exactly even if the two columns'
            // total scrollable heights differ slightly (e.g. from padding or borders).
            const maxTimelineScroll = elements.timelineScrollArea.scrollHeight - elements.timelineScrollArea.clientHeight;
            const maxHeaderScroll = elements.layerHeadersContainer.scrollHeight - elements.layerHeadersContainer.clientHeight;
            const desiredHeaderScroll = maxTimelineScroll > 0
                ? (elements.timelineScrollArea.scrollTop / maxTimelineScroll) * maxHeaderScroll
                : 0;
            if (Math.abs(elements.layerHeadersContainer.scrollTop - desiredHeaderScroll) > 0.5) {
                elements.layerHeadersContainer.scrollTop = desiredHeaderScroll;
            }

            const viewportWidth = getViewportWidth();

            state.events.forEach(evt => {
                const clipEl = document.getElementById(evt.id);
                if (!clipEl) return;
                
                const isCrossing = !evt.allDay && evt.date === state.todayKey && state.currentSystemSeconds >= evt.start && state.currentSystemSeconds <= (evt.start + evt.duration);
                if (isCrossing) {
                    clipEl.classList.add('clip-active-now');
                } else {
                    clipEl.classList.remove('clip-active-now');
                }

                keepClipLabelVisible(clipEl, scrollX, viewportWidth);
            });
        }

        // Keeps the event name/detail label visible inside the viewport even when
        // the timeline is scrolled so that only the middle (or end) of a long
        // event clip is in view -- mirrors the "sticky clip name" behaviour of
        // professional NLE/CG timelines (Premiere, Smartsheet Gantt, etc.).
        function keepClipLabelVisible(clipEl, scrollX, viewportWidth) {
            const labelEl = clipEl.querySelector('.clip-label-sticky');
            if (!labelEl) return;

            const leftPx = parseFloat(clipEl.style.left) || 0;
            const widthPx = parseFloat(clipEl.style.width) || 0;

            // Clip's rendered edges relative to the visible viewport (0 = left edge of canvas).
            const clipLeftInViewport = scrollX + leftPx;
            const clipRightInViewport = clipLeftInViewport + widthPx;

            // Reserve room on the right so the label never overlaps the duration
            // badge / resize handle when it's pinned near the clip's end.
            const reservedRight = 28;
            const maxOffset = Math.max(0, widthPx - reservedRight);

            // How far (in px, local to the clip) the viewport's left edge has
            // crept into the clip. 0 while the clip's own left edge is still visible.
            let offset = Math.max(0, -clipLeftInViewport);
            offset = Math.min(offset, maxOffset);

            // If the clip has scrolled entirely out of view, no need to move it further.
            const isFullyOffscreen = clipRightInViewport < 0 || clipLeftInViewport > viewportWidth;
            if (!isFullyOffscreen) {
                labelEl.style.transform = `translateX(${offset}px)`;
            }
        }

        function checkAlertCues() {
            state.events.forEach(evt => {
                if (!evt.alert || evt.alert === 0 || evt.date !== state.todayKey) return;

                const timeUntilStart = evt.start - state.currentSystemSeconds;

                if (timeUntilStart > 0 && timeUntilStart <= evt.alert) {
                    const cueKey = `${evt.id}-cue-${Math.floor(timeUntilStart)}`;
                    if (!state.activeCuesTriggered.has(cueKey) && Math.abs(timeUntilStart - evt.alert) < 0.3) {
                        state.activeCuesTriggered.add(cueKey);
                        triggerCueToast(evt, Math.round(timeUntilStart));
                        playBeep(1200, 'sine', 0.2);
                    }
                }

                if (Math.abs(state.currentSystemSeconds - evt.start) < 0.2) {
                    const startKey = `${evt.id}-start`;
                    if (!state.activeCuesTriggered.has(startKey)) {
                        state.activeCuesTriggered.add(startKey);
                        triggerLiveToast(evt);
                        playBeep(1600, 'triangle', 0.4);
                    }
                }
            });
        }

        function triggerCueToast(evt, seconds) {
            const toast = document.createElement('div');
            toast.className = 'toast-animate bg-slate-900/95 border-l-4 border-amber-500 text-slate-100 p-3.5 rounded-r-xl shadow-2xl flex items-center justify-between gap-3 pointer-events-auto backdrop-blur-md border border-slate-800';
            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-clock text-sm animate-bounce"></i>
                    </div>
                    <div>
                        <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">CUE WARNING (in ${seconds}s)</div>
                        <div class="font-bold text-xs truncate max-w-[200px]">${evt.label}</div>
                        <div class="text-[10px] text-slate-400 font-mono">On air at ${secondsToTimecode(evt.start)}</div>
                    </div>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            elements.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 6000);
        }

        function triggerLiveToast(evt) {
            const toast = document.createElement('div');
            toast.className = 'toast-animate bg-slate-900/95 border-l-4 border-emerald-500 text-slate-100 p-3.5 rounded-r-xl shadow-2xl flex items-center justify-between gap-3 pointer-events-auto backdrop-blur-md border border-slate-800';
            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-tower-cell text-sm animate-pulse"></i>
                    </div>
                    <div>
                        <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">ON AIR NOW (On Air)</div>
                        <div class="font-bold text-xs truncate max-w-[200px]">${evt.label}</div>
                    </div>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            elements.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function showToast(message, color = 'blue') {
            const colorMap = {
                emerald: { border: 'border-emerald-500', iconBg: 'bg-emerald-500/20', iconColor: 'text-emerald-400', icon: 'fa-check-circle' },
                amber: { border: 'border-amber-500', iconBg: 'bg-amber-500/20', iconColor: 'text-amber-400', icon: 'fa-exclamation-triangle' },
                blue: { border: 'border-blue-500', iconBg: 'bg-blue-500/20', iconColor: 'text-blue-400', icon: 'fa-info-circle' },
                rose: { border: 'border-rose-500', iconBg: 'bg-rose-500/20', iconColor: 'text-rose-400', icon: 'fa-xmark-circle' },
                cyan: { border: 'border-cyan-500', iconBg: 'bg-cyan-500/20', iconColor: 'text-cyan-400', icon: 'fa-clone' }
            };
            const c = colorMap[color] || colorMap.blue;
            const toast = document.createElement('div');
            toast.className = `toast-animate bg-slate-900/95 border-l-4 ${c.border} text-slate-100 p-3.5 rounded-r-xl shadow-2xl flex items-center justify-between gap-3 pointer-events-auto backdrop-blur-md border border-slate-800`;
            toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full ${c.iconBg} ${c.iconColor} flex items-center justify-center shrink-0">
                        <i class="fa-solid ${c.icon} text-sm"></i>
                    </div>
                    <div class="text-xs font-semibold">${message}</div>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            `;
            elements.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function refreshClipSelection() {
            state.events.forEach(evt => {
                const clipEl = document.getElementById(evt.id);
                if (!clipEl) return;
                if (state.selectedEvents.has(evt.id)) {
                    clipEl.classList.add('clip-selected');
                } else {
                    clipEl.classList.remove('clip-selected');
                }
            });
            updateSelectCount();
        }

        function updateSelectCount() {
            const count = state.selectedEvents.size;
            if (elements.selectCountNum) {
                elements.selectCountNum.textContent = count;
            }
        }

        function activatePasteMode() {
            if (state.locked) { notifyLocked(); return; }
            if (state.selectedEvents.size === 0 && state.events.length > 0 && !(state._pasteData && state._pasteData.events && state._pasteData.events.length)) {
                showToast('Select an event before Copy', 'amber');
                return;
            }
            state.pasteMode = true;

            const banner = document.createElement('div');
            banner.id = 'paste-mode-banner';
            banner.className = 'paste-mode-banner fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-cyan-600 text-white px-5 py-2.5 rounded-xl shadow-2xl flex items-center gap-3 text-xs font-bold border border-cyan-400';
            banner.innerHTML = `
                <i class="fa-solid fa-paste"></i>
                PASTE MODE — click on the timeline to place events
                <button id="btn-cancel-paste" class="ml-2 px-2 py-0.5 bg-cyan-800 hover:bg-cyan-700 rounded-lg transition text-[10px]">Cancel (ESC)</button>
            `;
            document.body.appendChild(banner);

            document.getElementById('btn-cancel-paste').addEventListener('click', deactivatePasteMode);
            document.addEventListener('keydown', pasteEscHandler);

            document.querySelectorAll('#layers-container > div').forEach(row => {
                row.classList.add('paste-target-highlight');
                row.style.cursor = 'crosshair';
                row.addEventListener('click', handlePasteClick);
            });
        }

        function deactivatePasteMode() {
            state.pasteMode = false;
            const banner = document.getElementById('paste-mode-banner');
            if (banner) banner.remove();
            document.removeEventListener('keydown', pasteEscHandler);
            document.querySelectorAll('#layers-container > div').forEach(row => {
                row.classList.remove('paste-target-highlight');
                row.style.cursor = '';
                row.removeEventListener('click', handlePasteClick);
            });
        }

        function pasteEscHandler(e) {
            if (e.key === 'Escape') deactivatePasteMode();
        }

        function handlePasteClick(e) {
            if (!state.pasteMode) return;
            const row = e.currentTarget;
            const layerId = row.dataset.layerId;

            const copiedEvents = state._pasteData ? state._pasteData.events : [];
            if (copiedEvents.length === 0) return;

            saveUndoState();
            copiedEvents.forEach(ev => {
                const newId = `evt-${Date.now()}-${Math.random().toString(36).substr(2, 5)}`;
                const newLayer = state.layers.find(l => l.id === layerId);
                state.events.push({
                    ...ev,
                    id: newId,
                    source: undefined,
                    gcalCalendarId: undefined,
                    date: state.viewDate,
                    layerId: newLayer ? newLayer.id : layerId,
                    start: ev.start,
                    duration: ev.duration,
                    label: ev.label,
                    detail: ev.detail || '',
                    color: ev.color,
                    alert: ev.alert
                });
            });

            deactivatePasteMode();
            renderTimeline();
            showToast(`Pasted ${copiedEvents.length} events to ${state.viewDate} (original times kept)`, 'cyan');
        }

        function renderIconPickerGrid(selectedIconClass) {
            elements.iconPickerGrid.innerHTML = '';
            availableIcons.forEach(iconObj => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isSelected = iconObj.class === selectedIconClass;
                btn.className = `p-2.5 rounded-lg border border-slate-800 bg-slate-900 hover:bg-slate-800 text-slate-300 transition flex flex-col items-center gap-1 ${isSelected ? 'icon-option-selected' : ''}`;
                btn.innerHTML = `
                    <i class="fa-solid ${iconObj.class} text-base"></i>
                `;
                btn.title = iconObj.label;
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#icon-picker-grid button').forEach(b => b.classList.remove('icon-option-selected'));
                    btn.classList.add('icon-option-selected');
                    elements.layerIconInput.value = iconObj.class;
                });
                elements.iconPickerGrid.appendChild(btn);
            });
        }

        function openLayerModal(layer = null) {
            if (state.locked) { notifyLocked(); return; }
            elements.layerModal.classList.remove('hidden');

            if (layer) {
                elements.layerModal.querySelector('h3').textContent = 'Channel Settings (Layer Settings)';
                document.getElementById('layer-id').value = layer.id;
                elements.layerNameInput.value = layer.name;
                elements.layerIconInput.value = layer.icon || 'fa-tv';
                elements.layerColorSelect.value = layer.color;
                elements.btnDeleteLayer.classList.remove('hidden');
                renderIconPickerGrid(layer.icon || 'fa-tv');
            } else {
                elements.layerModal.querySelector('h3').textContent = 'Add New Channel (New Layer)';
                elements.layerForm.reset();
                document.getElementById('layer-id').value = '';
                elements.layerIconInput.value = 'fa-tv';
                elements.layerColorSelect.value = 'border-slate-500 text-slate-400';
                elements.btnDeleteLayer.classList.add('hidden');
                renderIconPickerGrid('fa-tv');
            }
        }

        function closeLayerModal() {
            elements.layerModal.classList.add('hidden');
        }

        elements.layerModalClose.addEventListener('click', closeLayerModal);
        elements.btnCancelLayerModal.addEventListener('click', closeLayerModal);

        elements.layerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const layerId = document.getElementById('layer-id').value;
            const name = elements.layerNameInput.value.trim();
            const icon = elements.layerIconInput.value;
            const color = elements.layerColorSelect.value;

            if (layerId) {
                const targetLayer = state.layers.find(l => l.id === layerId);
                if (targetLayer) {
                    targetLayer.name = name;
                    targetLayer.icon = icon;
                    targetLayer.color = color;
                }
            } else {
                state.layers.push({
                    id: `track-${Date.now()}`,
                    name: name || `AUX Channel ${state.layers.length + 1}`,
                    icon: icon || 'fa-tv',
                    color: color
                });
            }

            closeLayerModal();
            renderTimeline();
        });

        elements.btnDeleteLayer.addEventListener('click', () => {
            const layerId = document.getElementById('layer-id').value;
            if (layerId) {
                state.layers = state.layers.filter(l => l.id !== layerId);
                state.events = state.events.filter(e => e.layerId !== layerId);
                closeLayerModal();
                renderTimeline();
            }
        });

        function openEventModal(evt = null) {
            if (state.locked) { notifyLocked(); return; }
            elements.eventModal.classList.remove('hidden');
            
            elements.eventModal.querySelector('#event-layer').innerHTML = state.layers.map(l => 
                `<option value="${l.id}">${l.name}</option>`
            ).join('');

            if (evt) {
                document.getElementById('modal-title').textContent = 'Edit Broadcast Item';
                document.getElementById('event-id').value = evt.id;
                document.getElementById('event-layer').value = evt.layerId;
                document.getElementById('event-label').value = evt.label;
                elements.eventDetail.value = evt.detail || '';
                elements.eventComment.value = evt.comment || '';
                
                elements.eventStartTimecode.value = secondsToTimecode(evt.start);
                elements.eventEndTimecode.value = secondsToTimecode(evt.start + evt.duration);
                elements.eventDuration.value = evt.duration;
                elements.eventShowTime.checked = evt.showTime !== false;

                document.getElementById('event-color').value = evt.color;
                document.getElementById('event-alert').value = evt.alert;
                syncEventColorTrigger();
                updateCharCounters();
                elements.btnDeleteEvent.classList.remove('hidden');
            } else {
                document.getElementById('modal-title').textContent = 'Add New Broadcast Item';
                elements.eventForm.reset();
                document.getElementById('event-id').value = '';
                updateCharCounters();
                
                const currentSec = Math.floor(state.currentSystemSeconds);
                const startSec = currentSec + 10;
                const duration = 60;

                elements.eventStartTimecode.value = secondsToTimecode(startSec);
                elements.eventEndTimecode.value = secondsToTimecode(startSec + duration);
                elements.eventDuration.value = duration;
                elements.eventShowTime.checked = true;
                syncEventColorTrigger();

                elements.btnDeleteEvent.classList.add('hidden');
            }
        }

        function autoFormatTimecode(input) {
            const val = input.value.replace(/\s/g, '');
            if (val.includes(':')) return;
            if (/^\d{4}$/.test(val)) {
                const h = Math.floor(parseInt(val) / 100);
                const m = parseInt(val) % 100;
                if (h <= 23 && m <= 59) {
                    input.value = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                }
            }
        }

        elements.eventStartTimecode.addEventListener('input', () => {
            autoFormatTimecode(elements.eventStartTimecode);
            const startSec = timecodeToSeconds(elements.eventStartTimecode.value);
            const duration = parseFloat(elements.eventDuration.value) || 0;
            elements.eventEndTimecode.value = secondsToTimecode(startSec + duration);
        });

        elements.eventEndTimecode.addEventListener('input', () => {
            autoFormatTimecode(elements.eventEndTimecode);
            const startSec = timecodeToSeconds(elements.eventStartTimecode.value);
            const endSec = timecodeToSeconds(elements.eventEndTimecode.value);
            const newDuration = Math.max(2, endSec - startSec);
            elements.eventDuration.value = newDuration;
        });

        elements.eventDuration.addEventListener('input', () => {
            const startSec = timecodeToSeconds(elements.eventStartTimecode.value);
            const duration = parseFloat(elements.eventDuration.value) || 0;
            elements.eventEndTimecode.value = secondsToTimecode(startSec + duration);
        });

        elements.modalClose.addEventListener('click', () => elements.eventModal.classList.add('hidden'));
        elements.btnCancelModal.addEventListener('click', () => elements.eventModal.classList.add('hidden'));

        elements.eventForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('event-id').value;
            const startSec = timecodeToSeconds(elements.eventStartTimecode.value);
            const duration = parseFloat(elements.eventDuration.value);

            if (startSec + duration > 86400) showToast('Events must end by 24:00; duration adjusted automatically', 'amber');
            const existingEvt = id ? state.events.find(e => e.id === id) : null;
            const eventData = {
                id: id || `evt-${Date.now()}`,
                date: (existingEvt && existingEvt.date) || state.viewDate,
                source: existingEvt ? existingEvt.source : undefined,
                gcalCalendarId: existingEvt ? existingEvt.gcalCalendarId : undefined,
                layerId: document.getElementById('event-layer').value,
                label: document.getElementById('event-label').value,
                detail: elements.eventDetail.value,
                comment: elements.eventComment.value,
                showTime: elements.eventShowTime.checked,
                start: Math.min(startSec, 86399),
                duration: Math.min(duration, 86400 - Math.min(startSec, 86399)),
                color: document.getElementById('event-color').value,
                alert: parseInt(document.getElementById('event-alert').value)
            };

            if (id) {
                const index = state.events.findIndex(e => e.id === id);
                if (index !== -1) {
                    saveUndoState();
                    state.events[index] = eventData;
                }
            } else {
                saveUndoState();
                state.events.push(eventData);
            }

            elements.eventModal.classList.add('hidden');
            renderTimeline();
        });

        elements.btnDeleteEvent.addEventListener('click', () => {
            const id = document.getElementById('event-id').value;
            if (id) {
                state.events = state.events.filter(e => e.id !== id);
                elements.eventModal.classList.add('hidden');
                renderTimeline();
            }
        });

        elements.timePresetsContainer.addEventListener('click', (e) => {
            const targetBtn = e.target.closest('.time-preset-btn');
            if (!targetBtn) return;

            const spanSeconds = parseInt(targetBtn.dataset.span);
            if (!spanSeconds) return;

            document.querySelectorAll('.time-preset-btn').forEach(btn => btn.classList.remove('preset-btn-active'));
            targetBtn.classList.add('preset-btn-active');

            state.activeSpanSeconds = spanSeconds;
            renderTimeline();
        });

        // Drag ruler to scroll timeline left/right + playhead moves with it
        let rulerDragging = false;
        let rulerDragStartX = 0;
        let rulerDragStartOffset = 0;

        elements.rulerContainer.addEventListener('mousedown', (e) => {
            rulerDragging = true;
            rulerDragStartX = e.clientX;
            rulerDragStartOffset = state.userOffsetPx;
            elements.rulerContainer.style.cursor = 'grabbing';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!rulerDragging) return;
            const deltaX = e.clientX - rulerDragStartX;
            state.userOffsetPx = rulerDragStartOffset + deltaX;
            updatePositions();
        });

        window.addEventListener('mouseup', () => {
            if (rulerDragging) {
                rulerDragging = false;
                elements.rulerContainer.style.cursor = '';
            }
        });

        elements.btnAudioToggle.addEventListener('click', () => {
            state.audioEnabled = !state.audioEnabled;
            if (state.audioEnabled) {
                elements.audioIcon.className = 'fa-solid fa-volume-high text-emerald-400';
                elements.audioStatusText.textContent = 'Alert Sound ON';
            } else {
                elements.audioIcon.className = 'fa-solid fa-volume-xmark text-slate-500';
                elements.audioStatusText.textContent = 'Alert Sound OFF';
            }
        });

        elements.btnAddClip.addEventListener('click', () => openEventModal());
        elements.btnAddLayer.addEventListener('click', () => openLayerModal());

        // Keep the layer-name sidebar's vertical scroll perfectly in sync with the
        // event canvas. The sidebar has no scrollbar of its own (overflow-y-hidden)
        // so its scrollTop is driven programmatically here whenever the canvas scrolls,
        // preventing the two columns from drifting apart when there are many/mixed-height layers.
        // Note: vertical sidebar scroll sync now happens every animation frame inside
        // updatePositions() (ratio-based), so no separate 'scroll' listener is needed here.

        // The header column itself has no scrollbar (overflow-y-hidden), so mouse-wheel
        // scrolling while hovering over the layer names wouldn't do anything on its own.
        // Forward that wheel input to the real scroll container instead.
        elements.layerHeadersContainer.addEventListener('wheel', (e) => {
            elements.timelineScrollArea.scrollTop += e.deltaY;
            e.preventDefault();
        }, { passive: false });

        elements.btnGoNow.addEventListener('click', () => {
            state.userOffsetPx = 0;
            updatePositions();
        });

        function jumpToTypedTime() {
            const raw = elements.gotoTimecode.value.trim();
            if (!raw) return;
            const targetSeconds = timecodeToSeconds(raw);
            elements.gotoTimecode.value = secondsToTimecode(targetSeconds);
            state.userOffsetPx = (state.currentSystemSeconds - targetSeconds) * state.pxPerSecond;
            updatePositions();
        }

        elements.btnGotoTime.addEventListener('click', jumpToTypedTime);
        elements.gotoTimecode.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                jumpToTypedTime();
            }
        });
        elements.gotoTimecode.addEventListener('blur', () => {
            const raw = elements.gotoTimecode.value.trim();
            if (!raw) return;
            elements.gotoTimecode.value = secondsToTimecode(timecodeToSeconds(raw));
        });

        function saveUndoState() {
            state.undoHistory.push({
                events: JSON.parse(JSON.stringify(state.events)),
                layers: JSON.parse(JSON.stringify(state.layers))
            });
            if (state.undoHistory.length > 50) state.undoHistory.shift();
        }

        elements.btnUndo.addEventListener('click', () => {
            if (state.locked) { notifyLocked(); return; }
            if (state.undoHistory.length === 0) {
                showToast('Nothing to Undo', 'amber');
                return;
            }
            const prev = state.undoHistory.pop();
            state.events = prev.events;
            state.layers = prev.layers;
            state.selectedEvents.clear();
            renderTimeline();
            showToast('Undo done', 'blue');
        });

        elements.btnDelete.addEventListener('click', () => {
            if (state.locked) { notifyLocked(); return; }
            if (state.selectedEvents.size === 0) {
                showToast('Select the events you want to delete', 'amber');
                return;
            }
            saveUndoState();
            const count = state.selectedEvents.size;
            state.events = state.events.filter(evt => !state.selectedEvents.has(evt.id));
            state.selectedEvents.clear();
            renderTimeline();
            showToast(`Deleted ${count} events`, 'red');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const tag = document.activeElement.tagName;
                if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
                if (state.pasteMode) return;
                if (state.locked) { if (state.selectedEvents.size > 0) notifyLocked(); return; }
                if (state.selectedEvents.size === 0) return;
                e.preventDefault();
                saveUndoState();
                const count = state.selectedEvents.size;
                state.events = state.events.filter(evt => !state.selectedEvents.has(evt.id));
                state.selectedEvents.clear();
                renderTimeline();
                showToast(`Deleted ${count} events`, 'red');
            }
        });

        elements.canvasContainer.addEventListener('click', (e) => {
            if (!e.target.closest('.clip-glow') && !state.pasteMode) {
                state.selectedEvents.clear();
                refreshClipSelection();
                hideEventTooltip();
            }
        });

        elements.btnExport.addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ layers: state.layers, events: state.events, exportedAt: new Date().toISOString() }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `broadcast-schedule-${dateKey(new Date())}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        elements.btnCopyTimeline.addEventListener('click', () => {
            if (state.selectedEvents.size === 0) {
                showToast('Click to select the events you want to copy first', 'amber');
                return;
            }
            const selectedArr = [];
            state.selectedEvents.forEach(id => {
                const ev = state.events.find(e => e.id === id);
                if (ev) selectedArr.push({ ...ev });
            });
            const copyData = {
                layers: state.layers.map(l => ({ ...l })),
                events: selectedArr
            };
            const ta = document.createElement('textarea');
            ta.value = JSON.stringify(copyData);
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            state._copiedData = copyData;
            showToast(`Copied ${selectedArr.length} events. Press Paste, then click a spot on the timeline`, 'emerald');
        });

        elements.btnPasteTimeline.addEventListener('click', () => {
            if (state._copiedData && state._copiedData.events && state._copiedData.events.length > 0) {
                state._pasteData = state._copiedData;
                activatePasteMode();
                return;
            }
            showToast('Nothing copied yet. Press Copy first', 'amber');
        });

        document.addEventListener('paste', (e) => {
            if (!state.pasteMode) return;
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (!text) return;
            try {
                const pasteData = JSON.parse(text);
                if (pasteData.events && Array.isArray(pasteData.events)) {
                    state._pasteData = pasteData;
                    showToast(`Ready to paste ${pasteData.events.length} events — click a spot on the timeline`, 'cyan');
                }
            } catch (err) {}
        });

        elements.btnImportTrigger.addEventListener('click', () => { if (state.locked) { notifyLocked(); return; } elements.importFileInput.click(); });
        elements.importFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported.layers && imported.events) {
                        if (!confirm('Importing this file will replace ALL current data (Undo can revert it). Continue?')) {
                            elements.importFileInput.value = '';
                            return;
                        }
                        saveUndoState();
                        state.layers = imported.layers;
                        state.events = imported.events.map(e => clampEventToDay({ ...e, date: e.date || state.viewDate }));
                        pruneOldEvents();
                        renderTimeline();
                    }
                } catch (err) {
                    alert('Invalid JSON file');
                }
            };
            reader.readAsText(file);
        });

        window.addEventListener('resize', () => {
            renderTimeline();
        });

        window.addEventListener('load', () => {
            initPersistence();
            renderTimeline();
            requestAnimationFrame(animationLoop);
        });
    </script>
</body>
</html>
