<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROADCAST ENGINEER EVENT CUE CONTROLL</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter, Prompt & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', 'Inter', sans-serif;
            background-color: #0b0d11;
            color: #e2e8f0;
            user-select: none;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        input[type="date"] { color-scheme: dark; }
        .is-locked .clip-glow { cursor: default !important; }
        .is-locked .resize-handle { pointer-events: none; }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #12161f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a3447;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3b82f6;
        }
        .timeline-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }
        .playhead-line-center {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.9), 0 0 30px rgba(239, 68, 68, 0.5);
        }
        .clip-glow {
            transition: box-shadow 0.2s ease, filter 0.2s ease;
        }
        .clip-glow:hover {
            filter: brightness(1.25);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }
        .clip-active-now {
            animation: pulseActive 1.5s infinite alternate;
            border-color: #38bdf8 !important;
        }
        @keyframes pulseActive {
            0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.4); }
            100% { box-shadow: 0 0 22px rgba(56, 189, 248, 0.9); }
        }
        .toast-animate {
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .preset-btn-active {
            background-color: #2563eb !important;
            color: #ffffff !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
        }
        .icon-option-selected {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.2) !important;
            color: #60a5fa !important;
        }
        .drag-over-top {
            border-top: 2px solid #3b82f6 !important;
        }
        .drag-over-bottom {
            border-bottom: 2px solid #3b82f6 !important;
        }
        .clip-selected {
            outline: 2px solid #38bdf8 !important;
            outline-offset: 1px;
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.6) !important;
        }
        .paste-mode-banner {
            animation: pasteFlash 1s infinite alternate;
        }
        @keyframes pasteFlash {
            0% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .paste-target-highlight {
            background-color: rgba(56, 189, 248, 0.15) !important;
        }
        #ruler-container {
            cursor: grab;
        }
        #ruler-container:active {
            cursor: grabbing;
        }
        #event-tooltip {
            position: fixed;
            z-index: 60;
            max-width: 260px;
            max-height: 55vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            pointer-events: none;
            background: linear-gradient(150deg, #f8fafc 0%, #cbd5e1 45%, #94a3b8 100%);
            color: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 15px;
            line-height: 1.45;
            box-shadow:
                0 16px 32px rgba(0, 0, 0, 0.45),
                0 6px 10px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.9),
                inset 0 -2px 3px rgba(15, 23, 42, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, -100%) translateY(-10px) scale(0.96);
            transition: opacity 0.12s ease, transform 0.12s ease;
        }
        #event-tooltip.visible {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -100%) translateY(-10px) scale(1);
        }
        #event-tooltip::-webkit-scrollbar {
            display: none;
        }
        #event-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 6px;
            border-style: solid;
            border-color: #94a3b8 transparent transparent transparent;
            filter: drop-shadow(0 2px 1px rgba(0,0,0,0.3));
        }
        /* When there is not enough space above, expand the tooltip below instead (prevents long text being cut off above the screen) */
        #event-tooltip.tooltip-below {
            transform: translate(-50%, 0) translateY(10px) scale(0.96);
        }
        #event-tooltip.tooltip-below.visible {
            transform: translate(-50%, 0) translateY(10px) scale(1);
        }
        #event-tooltip.tooltip-below::after {
            top: auto;
            bottom: 100%;
            border-color: transparent transparent #f8fafc transparent;
            filter: drop-shadow(0 -2px 1px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-sm">

    <!-- Top Bar: Realtime System Clock Reference -->
    <header class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 flex flex-wrap items-center justify-between gap-3 z-30 shadow-lg backdrop-blur-md">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600/20 text-red-500 p-2 rounded-xl border border-red-500/30 flex items-center justify-center">
                <i class="fa-solid font-bold fa-tower-broadcast text-lg animate-pulse"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm md:text-base tracking-wide text-white flex items-center gap-2">
                    BROADCAST ENGINEER EVENT CUE CONTROLL
                </h1>
                <p class="text-[11px] text-slate-400">Real-time broadcast cue alert system • Center Target Line Mode</p>
            </div>
        </div>

        <!-- Single System Clock Reference Header -->
        <div class="flex items-center space-x-4 bg-slate-950 px-5 py-1.5 rounded-xl border border-slate-800/80 shadow-inner">
            <div class="flex items-center space-x-3">
                <i class="fa-regular fa-clock text-emerald-400 text-lg"></i>
                <div>
                    <div class="text-[9px] uppercase tracking-wider text-slate-500 font-bold">Current Time (SYSTEM CLOCK)</div>
                    <div id="wall-clock" class="font-mono text-3xl font-extrabold text-emerald-400 leading-none">00:00:00.0</div>
                </div>
            </div>
            <button id="btn-go-now" class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md font-bold text-xs transition shadow-md shadow-emerald-600/30" title="Center timeline to current time">
                Now
            </button>

            <div class="h-8 w-px bg-slate-800"></div>

            <div class="flex items-center space-x-1.5">
                <label for="goto-timecode" class="text-[10px] uppercase tracking-wider text-slate-500 font-bold">Go to</label>
                <input type="text" id="goto-timecode" placeholder="HH:MM" maxlength="5" class="w-16 bg-slate-900 border border-slate-700 rounded-md px-2 py-1 text-center text-amber-400 font-mono font-bold text-xs focus:outline-none focus:border-blue-500" title="Enter time, e.g. 15:54 or 1554, then press Enter">
                <button id="btn-goto-time" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-md font-bold text-xs transition" title="Jump timeline to the specified time">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Control Action Tools -->
        <div class="flex items-center space-x-2">
            <div class="flex items-center gap-1.5">
                <button id="btn-date-prev" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 border border-slate-700 rounded-lg transition" title="Previous day"><i class="fa-solid fa-chevron-left"></i></button>
                <input type="date" id="view-date" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 text-[15px] font-mono" title="Select date (data kept for 3 months)">
                <button id="btn-date-next" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 border border-slate-700 rounded-lg transition" title="Next day"><i class="fa-solid fa-chevron-right"></i></button>
                <button id="btn-date-today" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition">Today</button>
                <span id="save-status" class="text-[11px] text-slate-500 font-mono hidden lg:inline"></span>
            </div>
            <div class="h-6 w-px bg-slate-800 mx-1"></div>
            <button id="btn-audio-toggle" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Toggle Cue Beep Audio">
                <i id="audio-icon" class="fa-solid fa-volume-high text-emerald-400"></i> <span id="audio-status-text">Alert Sound ON</span>
            </button>
            <div class="h-6 w-px bg-slate-800 mx-1"></div>
            <button id="btn-tools-toggle" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Show/hide edit tools" aria-expanded="false">
                <i class="fa-solid fa-screwdriver-wrench text-slate-400"></i> <span id="tools-toggle-text">Show Tools</span> <i id="tools-lock-indicator" class="fa-solid fa-lock text-red-400 text-xs hidden"></i>
            </button>
            <div id="edit-tools" class="hidden items-center space-x-2">
            <div class="h-6 w-px bg-slate-800 mx-1"></div>
            <button id="btn-lock-edit" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Toggle: Locked / Editable (all events, all layers)">
                <i id="lock-icon" class="fa-solid fa-lock-open text-emerald-400"></i> <span id="lock-text">Editable</span>
            </button>
            <button id="btn-add-layer" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5">
                <i class="fa-solid fa-layer-group text-blue-400"></i> Add Layer
            </button>
            <button id="btn-add-clip" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium text-[15px] transition shadow-md shadow-blue-600/30 flex items-center gap-1.5">
                <i class="fa-solid fa-plus"></i> Add Event
            </button>

            <button id="btn-select-count" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Selected Events Count">
                <i class="fa-regular fa-hand-pointer text-yellow-400"></i> Select (<span id="select-count-num">0</span>)
            </button>
            <button id="btn-copy-timeline" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Copy Selected Events">
                <i class="fa-solid fa-copy text-cyan-400"></i> Copy
            </button>
            <button id="btn-paste-timeline" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Paste Timeline Events from Clipboard">
                <i class="fa-solid fa-paste text-green-400"></i> Paste
            </button>
            <button id="btn-undo" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Undo last action">
                <i class="fa-solid fa-rotate-left text-orange-400"></i> Undo
            </button>
            <button id="btn-delete" class="px-3 py-1.5 bg-slate-800 hover:bg-red-900/50 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Delete selected events">
                <i class="fa-solid fa-trash text-red-400"></i> Delete
            </button>
            <div class="h-6 w-px bg-slate-800 mx-1"></div>
            <button id="btn-export" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition text-xs" title="Export Schedule Config">
                <i class="fa-solid fa-download"></i>
            </button>
            <button id="btn-import-trigger" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition text-xs" title="Import Schedule Config">
                <i class="fa-solid fa-upload"></i>
            </button>
            <button id="btn-gcal" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg font-medium text-[15px] transition flex items-center gap-1.5" title="Pull events from Google Calendar"><i class="fa-brands fa-google text-sky-400"></i> Google Calendar</button>
            <input type="file" id="import-file-input" class="hidden" accept=".json">
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <div class="flex-1 flex overflow-hidden relative">
        
        <!-- Left Sidebar: Track Headers with Gear Settings -->
        <div class="w-60 md:w-64 bg-slate-900/95 border-r border-slate-800 flex flex-col z-30 shrink-0 shadow-xl">
            <div class="h-10 bg-slate-950 border-b border-slate-800 px-4 flex items-center justify-between text-xs font-semibold text-slate-400">
                <span>Channels / LAYERS</span>
                <span id="track-count" class="text-slate-500 font-mono text-[11px]">0 layers</span>
            </div>
            
            <div id="layer-headers-container" class="flex-1 overflow-y-hidden divide-y divide-slate-800/60">
                <!-- Dynamic Track Headers with ⚙️ button -->
            </div>
        </div>

        <!-- Center Fixed Cue Viewport Canvas -->
        <div class="flex-1 flex flex-col overflow-hidden relative bg-slate-950" id="canvas-container">
            
            <!-- FIXED CENTER RED PLAYHEAD MARKER -->
            <div id="playhead" class="absolute top-0 bottom-0 left-1/2 w-0.5 bg-red-500 z-40 playhead-line-center pointer-events-none -translate-x-1/2">
                <div class="w-32 h-6 bg-red-600 -translate-x-1/2 flex items-center justify-center rounded-b-md shadow-lg text-white font-bold text-[10px] border border-red-400/50 uppercase tracking-wider">
                    <i class="fa-solid fa-caret-down mr-1"></i> Current Time (CUE)
                </div>
            </div>

            <!-- Time Ruler Bar (HH:MM:SS) -->
            <div id="ruler-container" class="h-10 bg-slate-900 border-b border-slate-800 relative overflow-hidden select-none">
                <div id="ruler-ticks" class="absolute inset-y-0 left-0"></div>
            </div>

            <!-- Scrollable Multi-Layer Event Canvas -->
            <div id="timeline-scroll-area" class="flex-1 overflow-x-hidden overflow-y-auto relative timeline-grid select-none">
                <div id="layers-container" class="min-w-full divide-y divide-slate-800/40">
                    <!-- Dynamic Tracks and Visual Event Clips -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Status & Time Range Controls Bar -->
    <footer class="bg-slate-900 border-t border-slate-800 px-4 md:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3 z-30">
        <!-- Time Window Presets (30m, 1h, 3h, 6h, 12h, 24h, 48h) -->
        <div class="flex items-center space-x-2 ml-auto">
            <span class="text-xs font-semibold text-slate-300 mr-1 flex items-center gap-1.5">
                <i class="fa-solid fa-down-left-and-up-right-to-center text-blue-400 text-xs"></i> Timeline view span:
            </span>
            <div id="time-presets-container" class="inline-flex bg-slate-950 p-1 rounded-xl border border-slate-800 space-x-1">
                <button data-span="1800" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent">30 min</button>
                <button data-span="3600" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent preset-btn-active">1 hr</button>
                <button data-span="10800" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent">3 hr</button>
                <button data-span="21600" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent">6 hr</button>
                <button data-span="43200" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent">12 hr</button>
                <button data-span="86400" class="time-preset-btn px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition border border-transparent">24 hr</button>
            </div>
        </div>
    </footer>

    <!-- Toast Notification Overlay -->
    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Floating Comment Tooltip (Banner) -->
    <div id="event-tooltip"></div>

    <!-- Modal: Add / Edit Broadcast Event -->
    <div id="event-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl shadow-2xl p-6 text-slate-200">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                <h3 id="modal-title" class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-blue-400"></i> Edit Broadcast Item
                </h3>
                <button id="modal-close" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="event-form" class="space-y-4">
                <input type="hidden" id="event-id">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Select Layer / Channel</label>
                    <select id="event-layer" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500"></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Item / Event Clip Name</label>
                    <input type="text" id="event-label" required maxlength="1024" placeholder="e.g. Live Satellite Broadcast, Channel 1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    <div id="event-label-count" class="text-[11px] text-slate-500 text-right mt-1 font-mono"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Details</label>
                    <input type="text" id="event-detail" maxlength="4096" placeholder="e.g. Live broadcast of Asian Games" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                    <div id="event-detail-count" class="text-[11px] text-slate-500 text-right mt-1 font-mono"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-location-dot text-sky-400"></i> Location <span class="text-slate-500 font-normal">(shown when hovering over an event)</span>
                    </label>
                    <textarea id="event-comment" rows="2" maxlength="1024" placeholder="e.g. Studio 2, Newsroom" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500 resize-none"></textarea>
                    <div id="event-comment-count" class="text-[11px] text-slate-500 text-right mt-1 font-mono"></div>
                </div>

                <!-- Start Time & End Time (HH:MM) Inputs -->
                <div class="grid grid-cols-2 gap-3 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">
                            Start Time <span class="text-[10px] text-amber-400 font-mono">(HH:MM or 1800)</span>
                        </label>
                        <input type="text" id="event-start-timecode" required placeholder="1800 or 18:00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-amber-400 font-mono font-bold focus:outline-none focus:border-blue-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">
                            End Time <span class="text-[10px] text-amber-400 font-mono">(HH:MM or 1830)</span>
                        </label>
                        <input type="text" id="event-end-timecode" required placeholder="1830 or 18:30" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-amber-400 font-mono font-bold focus:outline-none focus:border-blue-500">
                    </div>

                    <label class="col-span-2 flex items-center gap-2 pt-1 cursor-pointer select-none">
                        <input type="checkbox" id="event-show-time" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-blue-500 focus:ring-blue-500 focus:ring-offset-slate-900 cursor-pointer">
                        <span class="text-xs font-medium text-slate-300">Show time on event (Start - End) on the timeline bar</span>
                    </label>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Auto-calculated Duration (seconds)</label>
                    <input type="number" id="event-duration" min="2" step="1" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-300 font-mono focus:outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Symbol Color</label>

                        <!-- Real value holder (kept for existing JS: .value get/set) -->
                        <select id="event-color" class="hidden">
                            <option value="emerald">Emerald (TV Live)</option>
                            <option value="amber">Amber (Satellite)</option>
                            <option value="blue">Electric Blue (Web/App)</option>
                            <option value="purple">Digital Purple (Social Stream)</option>
                            <option value="rose">Rescue Red (Emergency)</option>
                            <option value="cyan">Sky (Live Stream)</option>
                            <option value="yellow">Golden Yellow (Special)</option>
                            <option value="red">Red</option>
                            <option value="orange">Orange</option>
                            <option value="lime">Lime</option>

        // ===== Auto-save (localStorage) + date picker + keep 3 months of data =====
        const STORAGE_KEY = 'broadcast-cue-schedule-v1';
        const dateUI = {
            input: document.getElementById('view-date'),
            prev: document.getElementById('btn-date-prev'),
            next: document.getElementById('btn-date-next'),
            today: document.getElementById('btn-date-today'),
            status: document.getElementById('save-status')
        };
        let lastSavedBody = '';
        let storageErrorShown = false;

        function dateKey(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function shiftDateKey(key, days) {
            const [y, m, d] = key.split('-').map(Number);
            return dateKey(new Date(y, m - 1, d + days));
        }
        // Retention window: 1st day of last month through last day of next month
        function windowStartKey() { const n = new Date(); return dateKey(new Date(n.getFullYear(), n.getMonth() - 1, 1)); }
        function windowEndKey() { const n = new Date(); return dateKey(new Date(n.getFullYear(), n.getMonth() + 2, 0)); }

        function clampEventToDay(e) {
            const start = Math.min(Math.max(0, Number(e.start) || 0), 86399);
            const duration = Math.min(Math.max(1, Number(e.duration) || 1), 86400 - start);
            return { ...e, start, duration };
        }

        function pruneOldEvents() {
            const start = windowStartKey();
            const before = state.events.length;
            state.events = state.events.filter(e => !e.date || e.date >= start);
            const removed = before - state.events.length;
            if (removed > 0) showToast(`Deleted ${removed} events older than ${start}`, 'amber');
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (Array.isArray(saved.layers) && Array.isArray(saved.events)) {
                    state.layers = saved.layers;
                    state.events = saved.events.map(e => clampEventToDay({ ...e, date: e.date || state.todayKey }));
                }
            } catch (err) {
                console.warn('Failed to load saved data', err);
            }
        }

        function saveToStorage() {
            try {
                const body = JSON.stringify({ layers: state.layers, events: state.events });
                if (body === lastSavedBody) return;
                localStorage.setItem(STORAGE_KEY, body);
                lastSavedBody = body;
                dateUI.status.textContent = `Saved ${new Date().toTimeString().slice(0, 8)}`;
                dateUI.status.classList.remove('text-red-400');
                dateUI.status.classList.add('text-slate-500');
            } catch (err) {
                dateUI.status.textContent = 'Save failed';
                dateUI.status.classList.remove('text-slate-500');
                dateUI.status.classList.add('text-red-400');
                if (!storageErrorShown) {
                    storageErrorShown = true;
                    showToast('Cannot save to browser (storage full or disabled). Please Export a backup', 'red');
                }
            }
        }

        function updateDateUI() {
            const min = windowStartKey(), max = windowEndKey();
            dateUI.input.min = min;
            dateUI.input.max = max;
            dateUI.input.value = state.viewDate;
            dateUI.prev.disabled = state.viewDate <= min;
            dateUI.next.disabled = state.viewDate >= max;
        }

        function setViewDate(key) {
            const min = windowStartKey(), max = windowEndKey();
            if (key < min || key > max) {
                showToast(`Only ${min} to ${max} is allowed (3-month retention)`, 'amber');
                key = key < min ? min : max;
            }
            if (state.pasteMode) deactivatePasteMode();
            hideEventTooltip();
            state.viewDate = key;
            state.selectedEvents.clear();
            renderTimeline();
            updateSelectCount();
            updateDateUI();
        }

        // Midnight rollover: if viewing today, advance to the new day and prune data outside the 3-month window
        function syncToday(now) {
            const key = dateKey(now);
            if (key === state.todayKey) return;
            const wasViewingToday = state.viewDate === state.todayKey;
            state.todayKey = key;
            if (wasViewingToday) state.viewDate = key;
            pruneOldEvents();
            renderTimeline();
            updateDateUI();
        }

        function toolsAreHidden() {
            const panel = document.getElementById('edit-tools');
            return !panel || panel.classList.contains('hidden');
        }

        function initToolsToggle() {
            const KEY = 'broadcast-cue-tools-visible';
            const panel = document.getElementById('edit-tools');
            const btn = document.getElementById('btn-tools-toggle');
            const text = document.getElementById('tools-toggle-text');
            const apply = (show) => {
                panel.classList.toggle('hidden', !show);
                panel.classList.toggle('flex', show);
                text.textContent = show ? 'Hide Tools' : 'Show Tools';
                btn.setAttribute('aria-expanded', String(show));
                if (show) hideEventTooltip();
            };
            let visible = false;
            try { visible = localStorage.getItem(KEY) === '1'; } catch (err) {}
            apply(visible);
            btn.addEventListener('click', () => {
                visible = !visible;
                apply(visible);
                try { localStorage.setItem(KEY, visible ? '1' : '0'); } catch (err) {}
            });
        }

        const LOCK_KEY = 'broadcast-cue-locked';
        const LOCK_GUARDED_IDS = ['btn-add-layer', 'btn-add-clip', 'btn-paste-timeline', 'btn-undo', 'btn-delete', 'btn-import-trigger'];

        function notifyLocked() {
            showToast('Locked: editing disabled (unlock via Tools → Editable)', 'amber');
        }

        function applyLock(locked) {
            state.locked = locked;
            if (locked && state.pasteMode) deactivatePasteMode();
            document.body.classList.toggle('is-locked', locked);
            LOCK_GUARDED_IDS.forEach(id => {
                const b = document.getElementById(id);
                if (!b) return;
                b.disabled = locked;
                b.style.opacity = locked ? '0.4' : '';
                b.style.cursor = locked ? 'not-allowed' : '';
            });
            document.getElementById('lock-icon').className = locked ? 'fa-solid fa-lock text-red-400' : 'fa-solid fa-lock-open text-emerald-400';
            const t = document.getElementById('lock-text');
            t.textContent = locked ? 'Locked' : 'Editable';
            t.classList.toggle('text-red-400', locked);
            document.getElementById('tools-lock-indicator').classList.toggle('hidden', !locked);
        }

        function initLock() {
            let locked = false;
            try { locked = localStorage.getItem(LOCK_KEY) === '1'; } catch (err) {}
            applyLock(locked);
            document.getElementById('btn-lock-edit').addEventListener('click', () => {
                locked = !locked;
                applyLock(locked);
                try { localStorage.setItem(LOCK_KEY, locked ? '1' : '0'); } catch (err) {}
                showToast(locked ? 'Locked: editing disabled for all events and layers' : 'Unlocked: editing enabled', locked ? 'red' : 'emerald');
            });
        }

        // ===== Google Calendar: pull events into the timeline (read-only) =====
        const GCAL_KEY = 'broadcast-cue-gcal';
        const gcal = { token: null, tokenExp: 0, calendars: [] };

        function gcalSettings() { try { return JSON.parse(localStorage.getItem(GCAL_KEY)) || {}; } catch (err) { return {}; } }
        function gcalSaveSettings(patch) { try { localStorage.setItem(GCAL_KEY, JSON.stringify({ ...gcalSettings(), ...patch })); } catch (err) {} }
        // Calendar text may come from other people (invitations), so strip HTML before putting it on the timeline
        function gcalClean(v) {
            return String(v || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '').replace(/[<>"'`]/g, '');
        }
        function gcalSetStatus(msg, isError) {
            const el = document.getElementById('gcal-status');
            el.textContent = msg;
            el.className = 'text-[13px] min-h-[20px] ' + (isError ? 'text-red-400' : 'text-slate-400');
        }

        function gcalLoadGis() {
            return new Promise((resolve, reject) => {
                if (window.google && google.accounts && google.accounts.oauth2) return resolve();
                const sc = document.createElement('script');
                sc.src = 'https://accounts.google.com/gsi/client';
                sc.onload = () => resolve();
                sc.onerror = () => reject(new Error('Failed to load the Google script. Check your internet connection'));
                document.head.appendChild(sc);
            });
        }

        async function gcalGetToken(clientId) {
            if (gcal.token && Date.now() < gcal.tokenExp - 60000) return gcal.token;
            await gcalLoadGis();
            return new Promise((resolve, reject) => {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: clientId,
                    scope: 'https://www.googleapis.com/auth/calendar.readonly',
                    callback: (resp) => {
                        if (resp.error) return reject(new Error(resp.error_description || resp.error));
                        gcal.token = resp.access_token;
                        gcal.tokenExp = Date.now() + (Number(resp.expires_in) || 3600) * 1000;
                        resolve(gcal.token);
                    },
                    error_callback: (err) => reject(new Error(err.message || err.type || 'Connection cancelled'))
                });
                client.requestAccessToken();
            });
        }

        async function gcalApi(url, clientId) {
            const token = await gcalGetToken(clientId);
            const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            if (res.status === 401) { gcal.token = null; throw new Error('Token expired. Please reconnect'); }
            if (!res.ok) {
                const j = await res.json().catch(() => ({}));
                throw new Error((j.error && j.error.message) || `Google API error (${res.status})`);
            }
            return res.json();
        }

        async function gcalConnect() {
            const clientId = document.getElementById('gcal-client-id').value.trim();
            if (!clientId) return gcalSetStatus('Please enter a Client ID first', true);
            gcalSaveSettings({ clientId });
            try {
                gcalSetStatus('Connecting...');
                const data = await gcalApi('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader', clientId);
                gcal.calendars = data.items || [];
                const sel = document.getElementById('gcal-calendar');
                sel.innerHTML = '';
                gcal.calendars.forEach(c => sel.add(new Option(c.summaryOverride || c.summary || c.id, c.id)));
                const saved = gcalSettings().calendarId;
                const primary = gcal.calendars.find(c => c.primary);
                sel.value = gcal.calendars.some(c => c.id === saved) ? saved : (primary ? primary.id : sel.value);
                document.getElementById('gcal-pull').disabled = gcal.calendars.length === 0;
                gcalSetStatus(`Connected. Found ${gcal.calendars.length} calendars`);
            } catch (err) {
                gcalSetStatus(err.message, true);
            }
        }

        async function gcalPull() {
            if (state.locked) { notifyLocked(); return; }
            const clientId = document.getElementById('gcal-client-id').value.trim();
            const calId = document.getElementById('gcal-calendar').value;
            if (!clientId || !calId) return gcalSetStatus('Please connect and select a calendar first', true);
            gcalSaveSettings({ clientId, calendarId: calId });
            const cal = gcal.calendars.find(c => c.id === calId);
            const calName = gcalClean((cal && (cal.summaryOverride || cal.summary)) || calId);
            const startKey = windowStartKey(), endKey = windowEndKey();
            const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
            const timeMin = toDate(startKey).toISOString();
            const timeMax = toDate(shiftDateKey(endKey, 1)).toISOString();
            try {
                gcalSetStatus('Pulling events...');
                const items = [];
                let pageToken = '';
                do {
                    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}` + (pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '');
                    const data = await gcalApi(url, clientId);
                    items.push(...(data.items || []));
                    pageToken = data.nextPageToken || '';
                } while (pageToken);

                saveUndoState();
                let layer = state.layers.find(l => l.gcalCalendarId === calId);
                if (!layer) {
                    layer = { id: `track-gcal-${Date.now()}`, name: calName, icon: 'fa-calendar-days', color: 'border-blue-500 text-blue-400', gcalCalendarId: calId };
                    state.layers.push(layer);
                }
                // Replace events previously synced from this calendar (manually created events are untouched)
                state.events = state.events.filter(e => !(e.source === 'gcal' && e.gcalCalendarId === calId));

                let added = 0, addedAllDay = 0;
                items.forEach(it => {
                    if (it.status === 'cancelled') return;
                    if (it.start && it.start.date && it.end && it.end.date) {
                        // All-day events: Google returns plain dates (no time/timezone), so use them as-is
                        let key = it.start.date;
                        while (key < it.end.date) {
                            if (key >= startKey && key <= endKey) {
                                state.events.push({
                                    id: `gcal-${String(it.id).replace(/[^\w-]/g, '')}-${key}`,
                                    source: 'gcal', gcalCalendarId: calId, date: key, layerId: layer.id,
                                    label: gcalClean(it.summary) || '(No title)',
                                    detail: gcalClean(it.description).replace(/\s*\n\s*/g, ' ').trim().slice(0, 4096),
                                    comment: it.location ? `Location: ${gcalClean(it.location)}` : '',
                                    allDay: true, showTime: false,
                                    start: 0, duration: 86400,
                                    color: layer.color, alert: 0
                                });
                                added++; addedAllDay++;
                            }
                            key = shiftDateKey(key, 1);
                        }
                        return;
                    }
                    if (!it.start || !it.start.dateTime || !it.end || !it.end.dateTime) return;
                    const s0 = new Date(it.start.dateTime), e0 = new Date(it.end.dateTime);
                    if (!(e0 > s0)) return;
                    let day = new Date(s0.getFullYear(), s0.getMonth(), s0.getDate());
                    while (day < e0) {
                        const next = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1);
                        const segS = s0 > day ? s0 : day, segE = e0 < next ? e0 : next;
                        const key = dateKey(day);
                        if (key >= startKey && key <= endKey) {
                            state.events.push(clampEventToDay({
                                id: `gcal-${String(it.id).replace(/[^\w-]/g, '')}-${key}`,
                                source: 'gcal', gcalCalendarId: calId, date: key, layerId: layer.id,
                                label: gcalClean(it.summary) || '(No title)',
                                detail: gcalClean(it.description).replace(/\s*\n\s*/g, ' ').trim().slice(0, 4096),
                                comment: it.location ? `Location: ${gcalClean(it.location)}` : '',
                                showTime: true,
                                start: Math.round((segS - day) / 1000),
                                duration: Math.max(1, Math.round((segE - segS) / 1000)),
                                color: layer.color, alert: 30
                            }));
                            added++;
                        }
                        day = next;
                    }
                });
                renderTimeline();
                const msg = `Pulled ${added} events` + (addedAllDay ? ` (${addedAllDay} all-day)` : '');
                gcalSetStatus(msg);
                showToast(msg, 'emerald');
            } catch (err) {
                gcalSetStatus(err.message, true);
            }
        }

        function secondsToTimecode(totalSeconds) {
            totalSeconds = (totalSeconds + 86400 * 2) % 86400;
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        }

        function timecodeToSeconds(timecodeStr) {
            if (!timecodeStr) return 0;
            let str = timecodeStr.trim();
            if (str.includes(':')) {
                const parts = str.split(':').map(Number);
                if (parts.length === 2) {
                    return (parts[0] * 3600) + (parts[1] * 60);
                } else if (parts.length === 3) {
                    return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
                }
            } else {
                const num = parseInt(str, 10);
                if (!isNaN(num)) {
                    const h = Math.floor(num / 100);
                    const m = num % 100;
                    return (h * 3600) + (m * 60);
                }
            }
            return 0;
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq = 880, type = 'sine', duration = 0.15) {
            if (!state.audioEnabled) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

                    document.querySelectorAll('#layer-headers-container .drag-over-bottom').forEach(el => el.classList.remove('drag-over-bottom'));
                    dragState.draggedLayerId = null;
                });

                headerEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const rect = headerEl.getBoundingClientRect();
                    const midY = rect.top + rect.height / 2;
                    headerEl.classList.remove('drag-over-top', 'drag-over-bottom');
                    if (e.clientY < midY) {
                        headerEl.classList.add('drag-over-top');
                    } else {
                        headerEl.classList.add('drag-over-bottom');
                    }
                });

                headerEl.addEventListener('dragleave', () => {
                    headerEl.classList.remove('drag-over-top', 'drag-over-bottom');
                });

                headerEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (state.locked) return;
                    headerEl.classList.remove('drag-over-top', 'drag-over-bottom');
                    const fromId = e.dataTransfer.getData('text/plain');
                    const toId = layer.id;
                    if (fromId === toId) return;

                    const fromIdx = state.layers.findIndex(l => l.id === fromId);
                    const toIdx = state.layers.findIndex(l => l.id === toId);
                    if (fromIdx === -1 || toIdx === -1) return;

                    const rect = headerEl.getBoundingClientRect();
                    const midY = rect.top + rect.height / 2;
                    const insertBefore = e.clientY < midY;

                    const [movedLayer] = state.layers.splice(fromIdx, 1);
                    let newToIdx = state.layers.findIndex(l => l.id === toId);
                    if (!insertBefore) newToIdx += 1;

        function createClipElement(evt) {
            const colors = colorClasses[evt.color] || colorClasses.blue;
            const leftPx = evt.start * state.pxPerSecond;
            const widthPx = Math.max(12, evt.duration * state.pxPerSecond);
            const startTimeStr = secondsToTimecode(evt.start);
            const endTimeStr = secondsToTimecode(evt.start + evt.duration);
            const clip = document.createElement('div');
            clip.id = evt.id;
            clip.className = `absolute top-2.5 h-11 rounded-lg ${colors.bg} border ${colors.border} ${colors.text} cursor-pointer clip-glow shadow-md select-none group overflow-hidden` + (evt.allDay ? ' ring-2 ring-white/25' : '');
            clip.style.left = `${leftPx}px`;
            clip.style.width = `${widthPx}px`;

            const isVeryCompact = widthPx < 70;
            const isUltraCompact = widthPx < 35;

            clip.innerHTML = `
                <div class="clip-label-sticky absolute inset-y-0 left-0 flex items-center space-x-2 overflow-hidden pointer-events-none px-2.5 max-w-full">
                    ${!isUltraCompact ? `
                    <div class="w-4 h-4 rounded-full bg-slate-900/40 border border-white/30 flex items-center justify-center shrink-0">
                        <i class="fa-solid ${evt.allDay ? 'fa-calendar-day' : 'fa-play'} text-[8px] ${evt.allDay ? 'text-sky-300' : 'text-emerald-300'}"></i>
                    </div>` : ''}
                    <div class="truncate">
                        ${!isUltraCompact ? `<div class="font-bold text-[15px] truncate tracking-wide uppercase">${evt.allDay ? 'All day · ' : ''}${evt.label}${evt.detail ? ' <span class="font-normal text-[12px] opacity-80 normal-case">' + evt.detail + '</span>' : ''}</div>` : ''}
                        ${!isVeryCompact && evt.showTime !== false ? `<div class="text-[12px] opacity-90 font-mono">${startTimeStr} - ${endTimeStr}</div>` : ''}
                    </div>
                </div>

                ${!evt.allDay ? `<div class="resize-handle absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize hover:bg-white/40 rounded-r-lg"></div>` : ''}
            `;

            clip.addEventListener('click', (e) => {
                if (e.target.classList.contains('resize-handle')) return;
                e.stopPropagation();
                if (state.pasteMode) return;

                if (e.ctrlKey || e.metaKey) {
                    if (state.selectedEvents.has(evt.id)) {
                        state.selectedEvents.delete(evt.id);
                    } else {
                        state.selectedEvents.add(evt.id);
                    }
                } else {
                    if (state.selectedEvents.has(evt.id) && state.selectedEvents.size === 1) {
                        state.selectedEvents.clear();
                    } else {
                        state.selectedEvents.clear();
                        state.selectedEvents.add(evt.id);
                    }

                refreshClipSelection();

                // Click/tap to view "Event / Details / Location" only while Hide Tools is active (view-only mode)
                // Click the same event again to close

                    if (openTooltipEventId === evt.id) {

                        showEventTooltip(evt, e);
                    }
                }
            });

            clip.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                hideEventTooltip();
                openEventModal(evt);
            });

            makeDraggableAndResizable(clip, evt);

            return clip;
        }

        function positionEventTooltip(e) {
            const margin = 12;
            const tip = elements.eventTooltip;
            const tipWidth = tip.offsetWidth || 260;
            const tipHeight = tip.offsetHeight || 40;

            let x = e.clientX;
            x = Math.min(Math.max(x, margin + tipWidth / 2), window.innerWidth - margin - tipWidth / 2);

            // If the text is too long to fit above the cursor, show it below the cursor instead to avoid being cut off on screen
            const showBelow = (e.clientY - 14 - tipHeight) < margin;
            tip.classList.toggle('tooltip-below', showBelow);

            const y = showBelow
                ? Math.min(e.clientY + 14, window.innerHeight - margin - tipHeight)
                : Math.max(e.clientY - 14, margin + tipHeight);

            tip.style.left = `${x}px`;
            tip.style.top = `${y}px`;
